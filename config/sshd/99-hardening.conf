# ==============================================================================
#  🛡️ OpenSSH Server Hardening Configuration
# ==============================================================================
#  Loaded via /etc/ssh/sshd_config.d/99-hardening.conf on Debian/Ubuntu systems.
# ==============================================================================

# Authentication & Access Control
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 6

# Public Key Authentication (Enforced)
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication yes
ChallengeResponseAuthentication yes

# Multi-Factor Authentication (Public Key + Password/PAM)
UsePAM yes
AuthenticationMethods publickey,password publickey,keyboard-interactive

# Performance & Network Security
UseDNS no
